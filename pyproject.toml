[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auroralf"
version = "2.0.0"
description = "Deterministic, provenance-complete high-redshift UV luminosity-function research pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "astropy==7.2.0",
  "h5py==3.16.0",
  "hmf==3.6.0",
  "massfunc==0.2.2",
  "numpy==2.4.2",
  "scipy==1.17.1",
]

[dependency-groups]
analysis = [
  "certifi==2026.2.25",
  "colossus==1.3.17",
  "matplotlib==3.10.8",
  "psutil==7.2.2",
  "requests==2.32.5",
]
test = [
  "pytest==9.0.2",
]
slides = [
  "matplotlib==3.10.8",
]

[tool.setuptools.packages.find]
include = ["auroralf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
